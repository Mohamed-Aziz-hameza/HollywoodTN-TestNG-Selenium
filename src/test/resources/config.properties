# ============================================================
#  Configuration des tests Hollywood.tn
#  Toute valeur peut être surchargée en ligne de commande :
#     mvn test -Dbrowser=chrome -Dheadless=true
# ============================================================

# Site testé
base.url=https://hollywood.tn

# Navigateur : edge | chrome | firefox   (le TP utilise Edge)
browser=edge
# true = exécution sans fenêtre (utile pour CI / serveur)
headless=false

# Stratégie de chargement : eager (DOMContentLoaded) | normal | none
page.load.strategy=eager

# Délais (secondes)
page.load.timeout=60
explicit.wait=15
implicit.wait=0

# Dossier de sortie : rapport HTML, captures d'écran, traces d'exceptions
results.dir=test-results

# Informations de contact attendues sur la page « Contactez-nous »
expected.phone=29 222 107
expected.address=Khaznadar
expected.email=Hollywoodlabstore@gmail.com
